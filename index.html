<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget: Android Chrome shrinks the layout viewport for the keyboard, so the sticky key bar stays above it.
       iOS ignores it; app.js uses visualViewport there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181b">
  <title>Ansible course</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6e6e'/%3E%3Cpath d='M16 7l8 18h-4l-4-9-4 9H8z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <button id="menu" class="icon" type="button" aria-label="Open syllabus" aria-haspopup="dialog" aria-controls="syllabus">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="where">
      <span id="top-title">Ansible course</span>
      <span id="top-progress"></span>
    </div>
  </header>

  <dialog id="syllabus" aria-label="Syllabus">
    <div class="drawer-head">
      <h2>Syllabus</h2>
      <button id="close" class="icon" type="button" aria-label="Close syllabus">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav id="toc"></nav>
  </dialog>

  <main id="main" tabindex="-1">
    <article id="lesson"><p class="muted">Loading…</p></article>
    <nav id="pager" class="pager" aria-label="Lessons"></nav>
  </main>
</body>
</html>
