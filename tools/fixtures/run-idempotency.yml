- name: Idempotency
  hosts: web
  gather_facts: false
  vars:
    greeting: Hello
  handlers:
    - name: Report
      ansible.builtin.debug:
        msg: "{{ greeting }} from {{ inventory_hostname }}"
  pre_tasks:
    - ansible.builtin.ping:
  tasks:
    - name: Create a directory
      file:
        path: "/tmp/{{ inventory_hostname }}"
        state: directory
    - name: Create a marker once
      ansible.builtin.command: touch /tmp/{{ inventory_hostname }}/marker
      args:
        creates: /tmp/{{ inventory_hostname }}/marker
    - command: creates=/tmp/{{ inventory_hostname }}/m2 touch /tmp/{{ inventory_hostname }}/m2
    - name: Check uptime
      ansible.builtin.shell: uptime
      changed_when: false
    - name: Always changes
      ansible.builtin.command: "true"
      notify: Report
  post_tasks:
    - debug:
        var: greeting
    - debug:
